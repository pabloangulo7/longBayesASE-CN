name: Container

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - environment.yml
      - nextflow.config
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image tag follows the manifest version instead of a second copy of
      # it, so -profile docker can never point at a tag that was never built.
      - id: version
        run: echo "version=$(sed -n "s/.*container_tag *= *'\\(.*\\)'.*/\\1/p" nextflow.config)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/pabloangulo7/longbayesase-cn
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
