name: longbayesase-cn
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy=1.26
  - pandas=2.2
  - pysam=0.23
  - liftoff=1.6.3
  - gffread=0.12.7
  - minimap2=2.30
  - samtools=1.22.1
  - bedtools=2.31.1
  - subread=2.1.1
  - oarfish=0.10.3
  - r-base=4.3
  - r-data.table=1.17
  - r-rstan=2.32
  # rstan compiles the Stan model with g++ at run time; without a toolchain
  # every ASE task fails inside the container.
  - r-stanheaders=2.32
  - r-rcppeigen
  - r-bh
  - cxx-compiler
  - make
  # Nextflow uses ps inside tasks to collect trace/report resource metrics.
  - procps-ng
  - pytest=8.4
